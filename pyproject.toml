[tool.poetry]
name = "nexus-deepstream"
version = "0.1.0"
description = "Standalone DeepStream first-line node: FastAPI control plane + GPU pipeline"
authors = ["Nexus"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.115.0"
uvicorn = { extras = ["standard"], version = ">=0.32.0" }
jinja2 = ">=3.1.0"
python-multipart = ">=0.0.12"
pydantic = ">=2.7.0"
PyYAML = ">=6.0.0"
sqlalchemy = ">=2.0.0"
psycopg = { extras = ["binary"], version = ">=3.2.0" }
alembic = ">=1.13.0"

[tool.poetry.scripts]
nexus-deepstream = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
