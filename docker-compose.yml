services:
  postgres:
    image: postgres:16-alpine
    container_name: nexus-deepstream-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: ${POSTGRES_DB:-nexus_deepstream}
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - wal_buffers=16MB
      - -c
      - wal_compression=on
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - random_page_cost=1.1
      - -c
      - idle_in_transaction_session_timeout=10000
    volumes:
      - nexus-ds-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: nexus-deepstream-pgbouncer
    environment:
      DB_USER: ${POSTGRES_USER:-nexus}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-nexus_deepstream}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "20"
      MIN_POOL_SIZE: "5"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      TRACK_EXTRA_PARAMETERS: statement_timeout,idle_in_transaction_session_timeout,TimeZone
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  nexus-deepstream-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: nexus-deepstream-api:latest
    container_name: nexus-deepstream-api
    command: ["/bin/bash", "/opt/nexus_deepstream/shell/boot.sh"]
    expose:
      - "8080"
    env_file:
      - path: .env
        required: false
    environment:
      NEXUS_DS_HOST: "0.0.0.0"
      NEXUS_DS_PORT: "8080"
      NEXUS_DS_ROLE: api
      NEXUS_DS_DATA_DIR: /data/nexus_deepstream
      NEXUS_DS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@pgbouncer:5432/${POSTGRES_DB:-nexus_deepstream}
      NEXUS_DS_DATABASE_MIGRATE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@postgres:5432/${POSTGRES_DB:-nexus_deepstream}
      NEXUS_DS_DB_POOL_SIZE: "20"
      NEXUS_DS_DB_MAX_OVERFLOW: "20"
      NEXUS_DS_HISTORY_QUEUE: "20000"
      NEXUS_DS_HISTORY_BATCH: "200"
      NEXUS_DS_HISTORY_FLUSH_MS: "200"
      NEXUS_DS_VIDEO_URL: http://nexus-deepstream-video:8081
      NEXUS_DS_VIDEO_TOKEN: ${NEXUS_DS_VIDEO_TOKEN:-nexus-video-internal}
      NEXUS_DS_MINIO_ENDPOINT_URL: ${NEXUS_DS_MINIO_ENDPOINT_URL:-http://minio:9000}
      NEXUS_DS_MINIO_ACCESS_KEY: ${NEXUS_DS_MINIO_ACCESS_KEY:-minioadmin}
      NEXUS_DS_MINIO_SECRET_KEY: ${NEXUS_DS_MINIO_SECRET_KEY:-minioadmin}
      NEXUS_DS_MINIO_REGION: ${NEXUS_DS_MINIO_REGION:-us-east-1}
      NEXUS_DS_MINIO_BUCKET: ${NEXUS_DS_MINIO_BUCKET:-incidents}
      NEXUS_DS_MINIO_KEY_PREFIX: ${NEXUS_DS_MINIO_KEY_PREFIX:-incidents/ingest/}
      NEXUS_DS_MINIO_PUBLIC_URL: ${NEXUS_DS_MINIO_PUBLIC_URL:-http://127.0.0.1:9200}
      DEEPSTREAM_DEBUG_DIR: /data/nexus_deepstream/debug
    volumes:
      - nexus-ds-data:/data/nexus_deepstream
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v1/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    restart: unless-stopped

  nexus-deepstream-video:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-deepstream:latest
    container_name: nexus-deepstream-video
    entrypoint: ["/bin/bash"]
    command: ["/opt/nexus_deepstream/shell/video-boot.sh"]
    expose:
      - "8081"
    env_file:
      - path: .env
        required: false
    environment:
      NEXUS_DS_ROLE: video
      NEXUS_DS_VIDEO_HOST: "0.0.0.0"
      NEXUS_DS_VIDEO_PORT: "8081"
      NEXUS_DS_VIDEO_TOKEN: ${NEXUS_DS_VIDEO_TOKEN:-nexus-video-internal}
      NEXUS_DS_DATA_DIR: /data/nexus_deepstream
      NEXUS_DS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:-nexus}@pgbouncer:5432/${POSTGRES_DB:-nexus_deepstream}
      NEXUS_DS_DB_POOL_SIZE: "10"
      NEXUS_DS_DB_MAX_OVERFLOW: "10"
      NEXUS_DS_HISTORY_QUEUE: "20000"
      NEXUS_DS_HISTORY_BATCH: "200"
      NEXUS_DS_HISTORY_FLUSH_MS: "200"
      NEXUS_DS_SINK_WORKERS: "4"
      NEXUS_DS_SINK_QUEUE: "10000"
      DEEPSTREAM_YOLO_DIR: /opt/nexus_deepstream/models/yolo11n
      DEEPSTREAM_WORK_DIR: /tmp/nexus_deepstream
      DEEPSTREAM_DEBUG_DIR: /data/nexus_deepstream/debug
      NEXUS_DS_MINIO_ENDPOINT_URL: ${NEXUS_DS_MINIO_ENDPOINT_URL:-http://minio:9000}
      NEXUS_DS_MINIO_ACCESS_KEY: ${NEXUS_DS_MINIO_ACCESS_KEY:-minioadmin}
      NEXUS_DS_MINIO_SECRET_KEY: ${NEXUS_DS_MINIO_SECRET_KEY:-minioadmin}
      NEXUS_DS_MINIO_REGION: ${NEXUS_DS_MINIO_REGION:-us-east-1}
      NEXUS_DS_MINIO_BUCKET: ${NEXUS_DS_MINIO_BUCKET:-incidents}
      NEXUS_DS_MINIO_KEY_PREFIX: ${NEXUS_DS_MINIO_KEY_PREFIX:-incidents/ingest/}
      NEXUS_DS_MINIO_PUBLIC_URL: ${NEXUS_DS_MINIO_PUBLIC_URL:-http://127.0.0.1:9200}
      NEXUS_DS_UTC_OFFSET_HOURS: ${NEXUS_DS_UTC_OFFSET_HOURS:-5}
      NEXUS_DS_RING_SEGMENT_DIR: /data/nexus_deepstream/incident_ring_buffer
      NEXUS_DS_CLIPS_DIR: /data/nexus_deepstream/incident_clips
    volumes:
      - nexus-ds-data:/data/nexus_deepstream
      - ./models:/opt/nexus_deepstream/models
      - ./app:/opt/nexus_deepstream/app
      - ./shell:/opt/nexus_deepstream/shell:ro
    gpus: all
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
      nproc: 65535
    depends_on:
      nexus-deepstream-api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nexus-deepstream-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9200}:9000"
      - "${MINIO_CONSOLE_PORT:-9201}:9001"
    volumes:
      - nexus-ds-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: nexus-deepstream-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${NEXUS_DS_MINIO_BUCKET:-incidents}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb -p "local/$$MINIO_BUCKET"
        exit 0
    restart: "no"

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    image: nexus-deepstream-nginx:latest
    container_name: nexus-deepstream-nginx
    ports:
      - "${NEXUS_DS_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nexus-deepstream-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nexus-ds-data:
  nexus-ds-pg:
  nexus-ds-minio:
